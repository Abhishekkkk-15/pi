[project]
name = "pi-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mistralai>=2.7.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "prompt-toolkit>=3.0.0",
    "tavily-python>=0.5.0",
    "openai>=2.49.0",
    "tokenizers>=0.23.1",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "llm", "console", "interrupt", "permissions", "skills", "tools", "config", "memory", "models", "commands", "tokenizer", "compaction", "history_stub"]
packages = ["prompts", "providers"]
include-package-data = true

[tool.setuptools.package-data]
prompts = ["*.md"]

[project.scripts]
pi-python = "agent:main"


